[mypy]
# advance-phase runs `mypy .` from the project root, and pytest's conftest
# auto-discovery + the integration mirror both collide on the same module
# names:
#
#   tests/conftest.py  vs  03-development/tests/conftest.py
#   tests/test_fr*.py  vs  03-development/tests/integration/test_fr*.py (symlinks)
#
# The 03-development/tests/* tree is a pytest discovery surface, not a
# source tree: the conftest.py exists for `pytest 03-development/tests/integration/`
# ancestor lookup, and the integration/test_fr*.py files are symlinks to
# the canonical ../../tests/test_fr*.py. mypy's `mypy .` walk does not
# skip the mirror, and pytest's module naming does not apply to it, so
# the mirror files would all error with "Duplicate module named …" and
# abort the whole type check before examining anything else.
#
# Excluding the mirror leaves a single canonical module name per file.
exclude = (?x)^03-development/tests/
