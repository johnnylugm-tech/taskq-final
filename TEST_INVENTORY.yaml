# TEST_INVENTORY.yaml -- P1 Naming Authority (Round 2)
# Maps every FR/NFR acceptance criterion to expected test function names.
# These are the AUTHORITATIVE names that derive_test_cases.md preserves in
# TEST_SPEC.md (P2 single source of truth). Round-1 schema had a four-line
# example; round 2 enumerates every AC enumerated in
# 01-requirements/TRACEABILITY_MATRIX.md section 6.1 (96 ACs: 47 FR + 49 NFR),
# each as a separate tc_id entry so P1-to-P2 handoff validators and
# build_traceability --orphan-check can map both ways without ambiguity.
# Specified per AC and per test category (unit / static / integration / e2e).
# If a category is missing for a given FR/NFR, derive_test_cases.md fills the
# gap with names derived via the 7-Question Protocol.
format_version: "2.0"

# ---- test_inventory ------------------------------------------------------
# The P1 prompt (scripts/workflowgen/spec_phase1.py) calls the
# test_inventory: key REQUIRED -- "Non-conforming schema fails the load
# step". tests: is the enumerated 1:1 mapping with TRACEABILITY_MATRIX
# section 6.1 the prompt already describes; coverage_summary is the arithmetic
# it already checks. Each entry carries:
#
#   tc_id          TC-FR<NN>-<MM> for FR tests, TC-N<NN>-<MM> for NFR tests,
#                  one entry per AC -- never a range. <NN> is the zero-padded
#                  FR/NFR number, <MM> is the AC sequence number within that
#                  FR/NFR (matching SRS.md section 3/4 AC numbering).
#   fr / nfr       the requirement this AC belongs to (exactly one)
#   ac             the AC id within the FR/NFR (e.g. AC-1.3, AC-N2.7)
#   layer          unit | static | integration | e2e -- what runs it
#   test_function  the canonical test name (preserved by TEST_SPEC.md)
#   test_file      where the test_function will live
#   cross_ref_frs  optional -- list of OTHER FRs whose ACs share this test
#   cross_ref_nfrs optional -- list of OTHER NFRs whose ACs share this test
