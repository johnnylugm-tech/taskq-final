# Alembic configuration for taskq-api (FR-07).
# Three revisions: v1_initial, v2_tags, v3_split_results (see SPEC.md §5.2).

[alembic]
# Path to migration scripts (relative to this file).
script_location = migrations

# DSN — read from TASKQ_DB_URL via env.py; do NOT hardcode here (NFR-04).
# sqlalchemy.url =

# File template for new revisions.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for `create_date` columns. UTC is the only safe default.
timezone = UTC

# Logging — quiet by default; set to `debug` to trace SQL.
truncate_slug_length = 40
revision_environment = false
sourcel = true
sourcel = true
sourcel = true

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S